# Configuración mínima del proyecto Supabase.
#
# D-08: las migraciones se aplican al proyecto remoto con `pnpm db:push`
# (--db-url, sin depender del CLI). D-19: `supabase link` sí se usa para
# Edge Functions — su deploy no tiene equivalente a una conexión directa
# por DATABASE_URL.
#
# La región del proyecto es sa-east-1 (São Paulo) por residencia de datos
# (PLAN §11.3, habeas data Ley 1581).

project_id = "hwjmlyzzvpmhadldavbq"

[db]
major_version = 15
port = 54322
shadow_port = 54320

# ── Stack local (`supabase start`) — agregado 2026-09-07 para acelerar
#    `pnpm test` (D-08 seguía usando solo el proyecto remoto; local resuelve
#    exactamente lo que esa decisión dejó pendiente: reproducibilidad +
#    aislamiento, sin depender de la red). Perfil recortado a lo que las
#    pruebas realmente usan (grep sobre tests/): api/db/auth (todas las
#    pruebas), storage (5 archivos), edge_runtime (35 archivos invocan
#    Edge Functions). Apagado explícito lo que ninguna prueba usa —
#    realtime, studio, smtp local, analytics — para minimizar contenedores
#    y RAM en una máquina de 16 GB compartidos con Windows.
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_confirmations = false

[edge_runtime]
enabled = true

[analytics]
enabled = false

# D-19: verify_jwt = true (default) — la función usa auth: 'user'
# (@supabase/server), que requiere un JWT de usuario real. El scaffold de
# `supabase functions new` lo pone en false por defecto (pensado para
# auth: 'apikey'/'publishable'); se corrigió explícitamente aquí.
[functions.create-tenant]
enabled = true
verify_jwt = true
import_map = "./functions/create-tenant/deno.json"
entrypoint = "./functions/create-tenant/index.ts"

[functions.invite-user]
enabled = true
verify_jwt = true
import_map = "./functions/invite-user/deno.json"
entrypoint = "./functions/invite-user/index.ts"

[functions.accept-invitation]
enabled = true
verify_jwt = true
import_map = "./functions/accept-invitation/deno.json"
entrypoint = "./functions/accept-invitation/index.ts"

[functions.revoke-invitation]
enabled = true
verify_jwt = true
import_map = "./functions/revoke-invitation/deno.json"
entrypoint = "./functions/revoke-invitation/index.ts"

[functions.update-member-profile]
enabled = true
verify_jwt = true
import_map = "./functions/update-member-profile/deno.json"
entrypoint = "./functions/update-member-profile/index.ts"

[functions.resend-invitation]
enabled = true
verify_jwt = true
import_map = "./functions/resend-invitation/deno.json"
entrypoint = "./functions/resend-invitation/index.ts"

[functions.presupuesto-financiacion]
enabled = true
verify_jwt = true
import_map = "./functions/presupuesto-financiacion/deno.json"
entrypoint = "./functions/presupuesto-financiacion/index.ts"

[functions.presupuesto-previsualizar]
