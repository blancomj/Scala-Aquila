[functions.calcular-intereses]
enabled = true
verify_jwt = true
import_map = "./functions/calcular-intereses/deno.json"
entrypoint = "./functions/calcular-intereses/index.ts"

# Pública a propósito: el propietario/residente no tiene sesión (AD-26).
# Barrera doble (D-27): token HMAC firmado con expiración en `t`, o sesión de
# miembro activo; además rate-limit por IP y auditoría de cada acceso — ver
# cabecera de ver-estado-cuenta/index.ts.
[functions.ver-estado-cuenta]
enabled = true
verify_jwt = false
import_map = "./functions/ver-estado-cuenta/deno.json"
entrypoint = "./functions/ver-estado-cuenta/index.ts"

# Gatillo manual del administrador: envía por correo el estado de cuenta al
# propietario (D-28). Sesión obligatoria + rol auxiliar del tenant — pero la
# valida el propio código (const jwt = req.headers.get('authorization')...),
# no el gateway: verify_jwt=true en el gateway intercepta hasta el preflight
# OPTIONS (que nunca lleva Authorization) con un 401 sin cabeceras CORS,
# bloqueando la función ENTERA desde cualquier navegador — mismo patrón ya
# resuelto así en ver-estado-cuenta/enviar-estados-cuenta-pendientes.
[functions.enviar-estado-cuenta]
enabled = true
verify_jwt = false
import_map = "./functions/enviar-estado-cuenta/deno.json"
entrypoint = "./functions/enviar-estado-cuenta/index.ts"

[functions.ver-recibo-caja]
enabled = true
verify_jwt = false
import_map = "./functions/ver-recibo-caja/deno.json"
entrypoint = "./functions/ver-recibo-caja/index.ts"

[functions.enviar-recibo-caja]
enabled = true
verify_jwt = false
import_map = "./functions/enviar-recibo-caja/deno.json"
entrypoint = "./functions/enviar-recibo-caja/index.ts"

# Batch cron post-liquidación (D-28): notifica los estados emitidos por L5
# que aún no tienen rastro 'estado_cuenta.enviado' en audit_log. Sin JWT a
# propósito — se autentica con CRON_SECRET en el header x-cron-secret.
[functions.enviar-estados-cuenta-pendientes]
enabled = true
verify_jwt = false
import_map = "./functions/enviar-estados-cuenta-pendientes/deno.json"
entrypoint = "./functions/enviar-estados-cuenta-pendientes/index.ts"

[functions.probar-formula]
enabled = true
verify_jwt = true
import_map = "./functions/probar-formula/deno.json"
entrypoint = "./functions/probar-formula/index.ts"

# Fase 2 pasarelas de pago — dos puertas públicas, sin JWT a propósito:
# crear-intencion-pago la usa el propietario sin cuenta de usuario (AD-26,
# token HMAC del enlace de estado de cuenta) o un auxiliar autenticado (JWT
# verificado a mano dentro de la función, no por la plataforma);
# webhook-pasarela la llama el proveedor (Wompi), nunca un usuario — se
# autentica con el webhook_token de la URL + la firma del payload (D-31).
[functions.crear-intencion-pago]
enabled = true
verify_jwt = false
import_map = "./functions/crear-intencion-pago/deno.json"
entrypoint = "./functions/crear-intencion-pago/index.ts"

[functions.webhook-pasarela]
enabled = true
verify_jwt = false
import_map = "./functions/webhook-pasarela/deno.json"
entrypoint = "./functions/webhook-pasarela/index.ts"

# webhook-brevo: acuses de entrega de SMS y email (CAR §34.2, PRQ-CAR-019).
# Lo llama Brevo, nunca un usuario. Brevo no firma sus webhooks, así que
# autoriza el token de la URL (BREVO_WEBHOOK_TOKEN) — mismo criterio de
# puerta anónima que webhook-pasarela, con menos superficie: solo inserta
# acuses sobre envíos cuyo message_id ya existe.
# cartera-ejecutar-lote: worker por lotes de acciones de cobranza (CAR
# §18.4 paso 1). JWT normal — lo invoca un administrador o el cron con un
# token de servicio. Su defensa no es la ruta sino el modo: simula salvo
# que se pida ejecucion explícitamente, y ejecutar exige rol administrador.
[functions.cartera-ejecutar-lote]
enabled = true
import_map = "./functions/cartera-ejecutar-lote/deno.json"
entrypoint = "./functions/cartera-ejecutar-lote/index.ts"

# cartera-cron-diario: disparador de la corrida diaria (CAR §18). Lo llama
# pg_cron vía pg_net, nunca un usuario — autoriza el token de la ruta
# (CARTERA_CRON_TOKEN), mismo criterio que webhook-brevo. Solo CALCULA:
# no despacha mensajes.
# cartera-recalcular acepta auth [user, secret]: la interfaz manda JWT de
# usuario y el cron manda la clave secreta en apikey. La verificacion la
# hace el wrapper (withSupabase), no el gateway — por eso verify_jwt=false.
[functions.cartera-recalcular]
enabled = true
verify_jwt = false
import_map = "./functions/cartera-recalcular/deno.json"
entrypoint = "./functions/cartera-recalcular/index.ts"

[functions.cartera-cron-diario]
enabled = true
verify_jwt = false
import_map = "./functions/cartera-cron-diario/deno.json"
entrypoint = "./functions/cartera-cron-diario/index.ts"

# cartera-certificar-deuda: expide la certificación de deuda del art. 48
# (CAR §15.2, bloque 21). JWT normal — solo un administrador autenticado
# puede invocarla; sin cliente de servicio, RLS + guard_certificacion_insert
# hacen el resto.
[functions.cartera-certificar-deuda]
enabled = true
import_map = "./functions/cartera-certificar-deuda/deno.json"
entrypoint = "./functions/cartera-certificar-deuda/index.ts"

[functions.webhook-brevo]
enabled = true
verify_jwt = false
import_map = "./functions/webhook-brevo/deno.json"
entrypoint = "./functions/webhook-brevo/index.ts"

# Pantalla de resultado (§8.2): sondea el estado de una intención por su
# propio uuid (capability token, ver cabecera del archivo) — sin JWT, mismo
# motivo que crear-intencion-pago (AD-26).
[functions.ver-intencion-pago]
enabled = true
verify_jwt = false
import_map = "./functions/ver-intencion-pago/deno.json"
entrypoint = "./functions/ver-intencion-pago/index.ts"

# Job de expiración (§7) — cron, sin JWT, autenticado con CRON_SECRET (mismo
# patrón que enviar-estados-cuenta-pendientes).
[functions.expirar-intenciones-pago]
enabled = true
verify_jwt = false
import_map = "./functions/expirar-intenciones-pago/deno.json"
entrypoint = "./functions/expirar-intenciones-pago/index.ts"

# Compositor de correo: ambas rutas requieren una sesión de usuario válida.
[functions.toggle-compositor-correo]
enabled = true
verify_jwt = true
import_map = "./functions/toggle-compositor-correo/deno.json"
entrypoint = "./functions/toggle-compositor-correo/index.ts"

[functions.enviar-correo-compositor]
enabled = true
verify_jwt = true
import_map = "./functions/enviar-correo-compositor/deno.json"
entrypoint = "./functions/enviar-correo-compositor/index.ts"

# Único punto de escritura hacia auditoria_evidencias y el bucket privado
# auditoria-evidencias (PROMPT AUDITORÍA §34, §70) — requiere sesión de
# usuario real (auth: 'user'), de ahí verify_jwt = true.
[functions.subir-evidencia-auditoria]
enabled = true
verify_jwt = true
import_map = "./functions/subir-evidencia-auditoria/deno.json"
entrypoint = "./functions/subir-evidencia-auditoria/index.ts"
