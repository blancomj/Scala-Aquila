verify_jwt = true
import_map = "./functions/crear-novedad/deno.json"
entrypoint = "./functions/crear-novedad/index.ts"

[functions.aprobar-novedad]
enabled = true
verify_jwt = true
import_map = "./functions/aprobar-novedad/deno.json"
entrypoint = "./functions/aprobar-novedad/index.ts"

[functions.rechazar-novedad]
enabled = true
verify_jwt = true
import_map = "./functions/rechazar-novedad/deno.json"
entrypoint = "./functions/rechazar-novedad/index.ts"

[functions.registrar-pago]
enabled = true
verify_jwt = true
import_map = "./functions/registrar-pago/deno.json"
entrypoint = "./functions/registrar-pago/index.ts"

[functions.anular-pago]
