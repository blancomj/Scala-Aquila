name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 24 §42 — escaneo de secretos. Falla si una clave llega a un archivo versionado.
  # SEC-02: la service_role key jamás debe salir de .env (ignorado por git).
  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ningún JWT en archivos versionados
        # Excluye este propio workflow: contiene el patrón como texto
        # literal (el grep de abajo), así que se detectaría a sí mismo.
        run: |
          if git ls-files -z -- ':!.github/workflows/ci.yml' | xargs -0 grep -l 'eyJhbGciOi' 2>/dev/null; then
            echo "::error::Se encontró un JWT en un archivo versionado. Los secretos van en .env, nunca en el repositorio."
            exit 1
          fi
          echo "OK: ningún JWT en archivos versionados."

      - name: .env.example sin valores
        run: |
          if grep -E '^(SUPABASE_|BREVO_|UPSTASH_)[A-Z_]+=.+' .env.example; then
            echo "::error::.env.example contiene valores. Es una plantilla versionada: debe tener las claves vacías."
            exit 1
          fi
          echo "OK: .env.example solo contiene plantillas."

      - name: .env no versionado
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env está versionado. Debe estar ignorado por git."
            exit 1
          fi
          echo "OK: .env no está versionado."

  verify:
    runs-on: ubuntu-latest
    # E7: sin esto, leerEntorno() (tests/rls/helpers.ts) no encuentra
    # credenciales y las suites que golpean Supabase remoto se saltan en
    # silencio — "verde" sin haber corrido de verdad. Los VALORES de estos
    # secretos hay que cargarlos en GitHub → Settings → Secrets → Actions;
    # este archivo solo los referencia.
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      # Sin `with: version:` — pnpm/action-setup@v4 ya lee la versión del
      # campo "packageManager" de package.json; declararla dos veces causa
      # "Multiple versions of pnpm specified" (visto en CI real).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Debe ir primero: @aquila/shared se resuelve vía dist/ (package.json
      # "types"/"main"), y tanto tsc como Vitest lo necesitan construido.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

  # Docs/09 y PLAN §9.1 exigen cobertura ≥80% global
  # y 100% en financial-kernel, ael-runtime y types/permissions.ts (§12.3).
  coverage:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4
      # Sin `with: version:` — pnpm/action-setup@v4 ya lee la versión del
      # campo "packageManager" de package.json; declararla dos veces causa
      # "Multiple versions of pnpm specified" (visto en CI real).
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Mismo motivo que en `verify`: @aquila/shared y @aquila/liquidation-engine
      # se resuelven vía dist/ — sin build previo, Vitest no puede resolverlos
      # en un checkout limpio (visto en CI real: "Failed to resolve entry for
      # package").
      - run: pnpm build
      - run: pnpm test:coverage

  # E7 · cobertura de las Edge Functions (Deno) — Vitest no puede
  # instrumentar este runtime. Cubre solo _shared/*.ts (lógica pura); los
  # 4 index.ts (orquestación) se cubren vía tests/tenancy/create-tenant.test.ts
  # y tests/invitations/*.test.ts, que golpean las funciones desplegadas.
  edge-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: deno test --no-check --coverage=coverage/edge supabase/functions/_shared/
      - run: deno coverage --lcov --output=coverage/edge/lcov.info coverage/edge/
      - run: node scripts/check-edge-coverage.mjs

  # E7 · E2E real contra Supabase remoto (§12.1), incluido envío real por
  # Brevo en el flujo de invitación — solo en push a main, no en cada PR,
  # para no gastar cuota de Brevo ni el cupo de envío de correos de
  # confirmación de Supabase Auth en cada commit.
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      # Sin `with: version:` — pnpm/action-setup@v4 ya lee la versión del
      # campo "packageManager" de package.json; declararla dos veces causa
      # "Multiple versions of pnpm specified" (visto en CI real).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Debe ir primero: @aquila/shared se resuelve vía dist/, igual que en `verify`.
      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm test:e2e

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
